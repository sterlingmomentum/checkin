<style>
/* Layout: one calm reading column on sand, left-aligned like the site mockup; the sea sits at the foot of the page. */
:root {
  --ground: #EFE6D6;      /* sand */
  --surface: #FAF6EE;     /* dry, pale sand */
  --ink: #12294D;         /* logo navy */
  --ink-soft: #485B7A;
  --ocean: #1C6C84;       /* accent: deep water */
  --tide: #4A97A6;        /* logo teal */
  --foam: #DDEBEA;        /* shallow-water wash */
  --gold: #AD8E52;        /* logo hairline */
  --line: #D5C9B3;
  --btn-bg: #15335F;
  --btn-fg: #FAF6EE;
  --deep-bg: #14305A;
  --deep-fg: #F4EDE0;
  --deep-soft: #BFD3DC;
  --plate: #FBF8F2;
  --wave-back: #A3CCD1;
  --wave-mid: #3F8EA0;
  --wave-front: #15335F;

  --display: "Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --body: "Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --step--1: 0.8125rem;
  --step-0: 1.0625rem;
  --step-1: 1.3125rem;
  --step-2: 1.75rem;
  --step-3: clamp(2rem, 1.3rem + 2.6vw, 2.9rem);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0B1A2E; --surface: #12263F; --ink: #F1E9DA; --ink-soft: #B4C0D0;
    --ocean: #7FC6D0; --tide: #4A97A6; --foam: #17364C; --gold: #D0B27A; --line: #2A405C;
    --btn-bg: #7FC6D0; --btn-fg: #0B1A2E; --deep-bg: #173B5C; --deep-fg: #F1E9DA; --deep-soft: #B9D0DA;
    --plate: #F1E9DA; --wave-back: #16405A; --wave-mid: #1F6F86; --wave-front: #3A93A5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0B1A2E; --surface: #12263F; --ink: #F1E9DA; --ink-soft: #B4C0D0;
  --ocean: #7FC6D0; --tide: #4A97A6; --foam: #17364C; --gold: #D0B27A; --line: #2A405C;
  --btn-bg: #7FC6D0; --btn-fg: #0B1A2E; --deep-bg: #173B5C; --deep-fg: #F1E9DA; --deep-soft: #B9D0DA;
  --plate: #F1E9DA; --wave-back: #16405A; --wave-mid: #1F6F86; --wave-front: #3A93A5;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--body); font-size: var(--step-0); line-height: 1.6; }
.app { min-height: 100%; display: flex; flex-direction: column; }
.wrap { width: 100%; max-width: 62rem; margin-inline: auto; padding-inline: clamp(1rem, 4vw, 2.5rem); }

/* ---------- Brand bar ---------- */
.brand { padding-block: 0.85rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.brand-lockup { display: flex; align-items: center; gap: 0.75rem; }
.brand-plate { width: 3.25rem; height: 3.25rem; border-radius: 50%; background: var(--plate); display: grid; place-items: center; flex: none; }
.brand-plate img { width: 2.3rem; height: auto; display: block; }
.brand-name { font-family: var(--display); font-weight: 600; font-size: 1.125rem; letter-spacing: 0.2em; text-transform: uppercase; line-height: 1.2; }
.brand-context { font-size: var(--step--1); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }

/* ---------- Shared type ---------- */
main { flex: 1; padding-block: clamp(1rem, 4vw, 3rem) 3.5rem; }
.screen { display: flex; flex-direction: column; gap: 1.75rem; animation: settle 0.45s ease-out; }
@keyframes settle { from { transform: translateY(10px); opacity: 0.55; } to { transform: none; opacity: 1; } }
.eyebrow { font-size: var(--step--1); font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ocean); margin: 0; }
h1, h2, h3, p, ul, ol { margin: 0; }
.display { font-family: var(--display); font-weight: 500; font-size: var(--step-3); line-height: 1.12; letter-spacing: -0.005em; text-wrap: balance; }
.subhead { font-family: var(--display); font-style: italic; font-weight: 500; font-size: var(--step-1); line-height: 1.35; color: var(--ocean); }
.prose { display: flex; flex-direction: column; gap: 0.9rem; max-width: 36rem; }
.muted { color: var(--ink-soft); }
.small { font-size: var(--step--1); line-height: 1.55; }
.rule { width: 3.5rem; height: 1px; background: var(--gold); border: 0; margin: 0; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--ocean); outline-offset: 3px; }

/* ---------- Buttons ---------- */
.btn { font: inherit; font-size: 0.875rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; padding: 0.95rem 1.5rem; border-radius: 2px; border: 1px solid var(--btn-bg); background: var(--btn-bg); color: var(--btn-fg); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 0.6rem; transition: transform 0.15s ease, opacity 0.15s ease; }
.btn:hover { transform: translateY(-1px); }
.btn[aria-disabled="true"] { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn-quiet { background: transparent; color: var(--ink); border-color: var(--line); }
.btn .arrow { font-family: var(--body); letter-spacing: 0; }

/* ---------- Welcome ---------- */
.welcome-grid { display: grid; grid-template-columns: minmax(0, 56rem); }
.welcome .display { max-width: 34ch; font-size: clamp(1.85rem, 1.2rem + 1.8vw, 2.4rem); }
.welcome .prose { font-size: 1rem; line-height: 1.55; }
.welcome .welcome-main { gap: 0.9rem; }
main:has(.welcome) { padding-top: 0.25rem; }
.welcome .subhead { margin-top: -0.35rem; }
.welcome .prose { max-width: 54rem; gap: 0.7rem; }
.welcome .welcome-main { gap: 1.1rem; }
.welcome .welcome-cta { padding-top: 0.4rem; }
.pulse { position: relative; animation: pulse 2.4s ease-out infinite; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--tide) 65%, transparent); }
  70% { box-shadow: 0 0 0 14px color-mix(in srgb, var(--tide) 0%, transparent); }
  100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--tide) 0%, transparent); }
}
.pulse:hover, .pulse:focus-visible { animation-play-state: paused; }
.welcome-main { display: flex; flex-direction: column; gap: 1.5rem; min-width: 0; }
.welcome-cta { display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap; }
.expect { background: var(--foam); padding: 1.75rem 1.5rem; display: flex; flex-direction: column; gap: 1rem; min-width: 0; border-top: 1px solid var(--gold); }
.expect ul { list-style: none; padding: 0; display: flex; flex-direction: column; }
.expect li { padding-block: 0.7rem; border-top: 1px solid var(--line); font-family: var(--display); font-size: var(--step-1); line-height: 1.3; }
.expect li:first-child { border-top: 0; }

/* ---------- Question ---------- */
.progress { display: flex; flex-direction: column; gap: 0.6rem; }
.progress-track { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; max-width: 22rem; }
.progress-track span { height: 3px; background: var(--line); }
.progress-track span.done { background: var(--tide); }
.progress-track span.now { background: var(--ocean); }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 1.25rem; }
legend { padding: 0; display: block; width: 100%; margin-bottom: 1.75rem; }
.q-prompt { font-family: var(--display); font-weight: 500; font-size: clamp(1.6rem, 1.15rem + 1.7vw, 2.25rem); line-height: 1.2; max-width: 44rem; text-wrap: balance; display: block; }
.scale { display: grid; grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr)); gap: 0.6rem; }
.opt { position: relative; display: block; cursor: pointer; }
.opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.opt-face { display: flex; flex-direction: column; align-items: flex-start; gap: 0.85rem; height: 100%; padding: 1rem 1rem 1.1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 2px; font-weight: 500; line-height: 1.3; transition: border-color 0.15s ease, background 0.15s ease; }
.dot { width: 1.15rem; height: 1.15rem; border-radius: 50%; border: 1.5px solid var(--ink-soft); display: grid; place-items: center; flex: none; }
.dot::after { content: ""; width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--ocean); transform: scale(0); transition: transform 0.15s ease; }
.opt:hover .opt-face { border-color: var(--tide); }
.opt input:checked + .opt-face { border-color: var(--ocean); background: var(--foam); box-shadow: inset 0 0 0 1px var(--ocean); }
.opt input:checked + .opt-face .dot { border-color: var(--ocean); }
.opt input:checked + .opt-face .dot::after { transform: scale(1); }
.opt input:focus-visible + .opt-face { outline: 2px solid var(--ocean); outline-offset: 3px; }
.alt { display: flex; flex-direction: column; gap: 0.6rem; max-width: 30rem; }
.alt .opt-face { flex-direction: row; align-items: center; }
.nav { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
.hint { min-height: 1.4em; color: var(--ocean); font-weight: 500; }

/* ---------- Reflection page ---------- */
.notice-head { display: flex; flex-direction: column; gap: 1.25rem; }
.complete { position: relative; overflow: hidden; background: var(--deep-bg); color: var(--deep-fg); padding: clamp(2.75rem, 8vw, 5rem) clamp(1.5rem, 6vw, 4rem) clamp(4.5rem, 11vw, 7rem); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 1.5rem; }
.complete .mark { width: 4.25rem; height: 4.25rem; border-radius: 50%; background: var(--plate); display: grid; place-items: center; box-shadow: 0 0 0 1px var(--gold), 0 0 0 7px var(--deep-bg), 0 0 0 8px var(--gold); }
.complete .mark img { width: 3rem; height: auto; display: block; }
.complete h1 { font-family: var(--display); font-weight: 500; font-size: clamp(2.3rem, 1.3rem + 4vw, 4.1rem); line-height: 1.06; letter-spacing: -0.01em; max-width: 15ch; text-wrap: balance; }
.complete h1 em { display: block; font-style: italic; font-size: 0.55em; letter-spacing: 0.02em; color: var(--deep-soft); margin-bottom: 0.35em; }
.flourish { display: flex; align-items: center; gap: 0.75rem; color: var(--gold); }
.flourish::before, .flourish::after { content: ""; width: clamp(2.5rem, 8vw, 5rem); height: 1px; background: var(--gold); }
.flourish span { width: 6px; height: 6px; transform: rotate(45deg); border: 1px solid var(--gold); }
.complete p { max-width: 32rem; color: var(--deep-soft); }
.complete .sea { position: absolute; left: 0; right: 0; bottom: 0; height: clamp(40px, 7vw, 70px); }
.complete .sea svg { position: absolute; left: 0; bottom: 0; width: 2400px; height: 100%; }
.connect { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); background: var(--deep-bg); color: var(--deep-fg); }
.connect img { width: 100%; height: 100%; min-height: 20rem; object-fit: cover; object-position: 50% 20%; display: block; }
.connect-body { padding: clamp(1.75rem, 5vw, 3.25rem); display: flex; flex-direction: column; gap: 1.1rem; align-items: flex-start; justify-content: center; min-width: 0; }
.connect-body h2 { font-family: var(--display); font-weight: 600; font-size: var(--step-2); line-height: 1.2; text-wrap: balance; }
.connect-body p { max-width: 34rem; color: var(--deep-soft); }
.connect-body .who { font-family: var(--display); font-style: italic; font-size: var(--step-1); color: var(--deep-fg); }
.connect .btn { background: var(--deep-fg); border-color: var(--deep-fg); color: var(--deep-bg); }
.connect :focus-visible { outline-color: var(--deep-fg); }
.prompts { list-style: none; padding: 0; display: flex; flex-direction: column; max-width: 44rem; border-left: 1px solid var(--gold); }
.prompts li { font-family: var(--display); font-style: italic; font-weight: 500; font-size: var(--step-2); line-height: 1.25; padding: 0.6rem 0 0.6rem 1.5rem; text-wrap: balance; }
.results { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2rem clamp(1.5rem, 4vw, 3rem); padding-top: 2rem; border-top: 1px solid var(--line); }
.slot { display: flex; flex-direction: column; gap: 0.75rem; min-width: 0; max-width: 34rem; }
.slot h2 { font-family: var(--display); font-weight: 600; font-size: var(--step-2); line-height: 1.2; text-wrap: balance; }
.practice { grid-column: 1 / -1; max-width: none; background: var(--foam); padding: clamp(1.5rem, 4vw, 2.25rem); border-top: 1px solid var(--gold); }
.practice p:not(.eyebrow) { font-size: var(--step-1); line-height: 1.45; max-width: 40rem; }
.notice { display: flex; flex-direction: column; gap: 1.25rem; }
.notice h2 { font-family: var(--display); font-weight: 600; font-size: var(--step-2); line-height: 1.2; }
.recap { display: flex; flex-direction: column; gap: 1rem; padding-top: 2rem; border-top: 1px solid var(--line); }
.recap h2 { font-family: var(--display); font-weight: 600; font-size: var(--step-2); line-height: 1.2; }
.recap ol { list-style: none; padding: 0; display: flex; flex-direction: column; }
.recap li { display: grid; grid-template-columns: minmax(0, 1fr) 9.5rem; gap: 0.5rem 2rem; align-items: baseline; padding-block: 1rem; border-top: 1px solid var(--line); }
.recap li:first-child { border-top: 0; }
.recap .q { color: var(--ink-soft); max-width: 40rem; }
.recap .a { font-weight: 600; color: var(--ink); }
.statement { background: var(--foam); padding: clamp(2rem, 6vw, 3.5rem) clamp(1.5rem, 6vw, 4rem); display: flex; flex-direction: column; gap: 1.25rem; border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold); }
.statement p { font-family: var(--display); font-weight: 500; font-size: clamp(1.75rem, 1.2rem + 2vw, 2.6rem); line-height: 1.18; max-width: 46rem; text-wrap: balance; }
.invite { background: var(--deep-bg); color: var(--deep-fg); padding: clamp(1.75rem, 5vw, 3rem); display: flex; flex-direction: column; gap: 1.1rem; align-items: flex-start; }
.invite h2 { font-family: var(--display); font-weight: 600; font-size: var(--step-2); line-height: 1.2; }
.invite p { max-width: 38rem; color: var(--deep-soft); }
.invite .btn { background: var(--deep-fg); border-color: var(--deep-fg); color: var(--deep-bg); }
.invite :focus-visible { outline-color: var(--deep-fg); }
.tag { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; border: 1px dashed var(--deep-soft); color: var(--deep-fg); padding: 0.2rem 0.55rem; }
.invite .placeholder-note { font-size: var(--step--1); }

/* ---------- Shore ---------- */
.shore { position: relative; height: clamp(70px, 12vw, 130px); overflow: hidden; flex: none; }
.shore svg { position: absolute; left: 0; bottom: 0; width: 2400px; height: 100%; display: block; }
.complete .sea svg, .shore svg { will-change: transform; }
.shore .w1, .complete .w1 { animation: drift-a 46s linear infinite; }
.shore .w2, .complete .w2 { animation: drift-b 34s linear infinite; }
.shore .w3, .complete .w3 { animation: drift-c 58s linear infinite; }
@keyframes drift-a { to { transform: translateX(-800px); } }
@keyframes drift-b { to { transform: translateX(-600px); } }
@keyframes drift-c { to { transform: translateX(-1200px); } }

@media (max-width: 760px) {
  .welcome-grid { grid-template-columns: minmax(0, 1fr); }
  .scale { grid-template-columns: minmax(0, 1fr); }
  .opt-face { flex-direction: row; align-items: center; }
  .recap li { grid-template-columns: minmax(0, 1fr); }
  .results { grid-template-columns: minmax(0, 1fr); }
  .connect { grid-template-columns: minmax(0, 1fr); }
  .connect img { min-height: 0; height: auto; aspect-ratio: 4 / 4.2; max-width: 100%; }
  .brand-context { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .screen, .shore svg, .complete .sea svg, .pulse { animation: none; }
  .btn, .opt-face, .dot::after { transition: none; }
}
</style>
</head>

/* ---------- Results engine (spec v2.1, sections 4, 5 and 10) ----------
   Fixed rules only. The same six answers always return the same three
   content IDs. Nothing is sent anywhere and no AI is involved. */
const Q1 = "Q1_ENERGY_ALIGNMENT", Q2 = "Q2_RESTORATION", Q3 = "Q3_DEMAND_LOAD",
      Q4 = "Q4_PRIORITY_PROTECTION", Q5 = "Q5_RELATIONSHIPS", Q6 = "Q6_ADAPTABILITY";
const ITEMS = [Q1, Q2, Q3, Q4, Q5, Q6];
const SHORT = { [Q1]: "Q1", [Q2]: "Q2", [Q3]: "Q3", [Q4]: "Q4", [Q5]: "Q5", [Q6]: "Q6" };
const SUPPORT_ORDER = [Q6, Q4, Q2, Q1, Q5, Q3];
const STRETCH_ORDER = [Q3, Q4, Q2, Q1, Q5, Q6];

// responses: { item_id: visible label }. Returns the three content IDs.
function selectContent(responses) {
  const raw = {}, csv = {};
  for (const id of ITEMS) {
    const r = CONFIG.scale.indexOf(responses[id]);
    if (r < 0) throw new Error("Missing or unknown response for " + id);
    raw[id] = r;
    csv[id] = id === Q3 ? 4 - r : r;
  }
  const isStretch = id => csv[id] <= 1, isSupport = id => csv[id] >= 3;
  const stretchCount = ITEMS.filter(isStretch).length;
  const supportCount = ITEMS.filter(isSupport).length;
  const mixedCount = ITEMS.filter(id => csv[id] === 2).length;

  // 10.1 SUPPORT
  let support;
  if (raw[Q6] >= 3 && [Q1, Q2, Q3, Q4, Q5].filter(isStretch).length >= 2) support = "SUP_D_ADAPTABILITY_UNDER_STRETCH";
  else if (raw[Q3] >= 3 && raw[Q4] >= 3) support = "SUP_E_PRIORITIES_UNDER_DEMAND";
  else if (raw[Q3] >= 3 && raw[Q2] >= 3) support = "SUP_F_RESTORATION_UNDER_DEMAND";
  else {
    const top = SUPPORT_ORDER.find(isSupport);
    support = top ? "SUP_" + SHORT[top] : "SUP_FALLBACK_AWARENESS";
  }

  // 10.2 PATTERN
  const topStretch = STRETCH_ORDER.find(isStretch);
  let pattern;
  if (supportCount >= 5 && stretchCount === 0) pattern = "PAT_G_STRONG_SUPPORT";
  else if (raw[Q3] >= 3 && raw[Q4] <= 2) pattern = "PAT_A_PRIORITY_CROWDOUT";
  else if (raw[Q3] >= 3 && raw[Q5] <= 2) pattern = "PAT_C_RELATIONSHIPS";
  else if (raw[Q1] <= 1 && raw[Q2] <= 1) pattern = "PAT_B_ENERGY_RESTORE";
  else if (stretchCount >= 4) pattern = "PAT_H_MULTIPLE_STRETCH";
  else if (mixedCount >= 4) pattern = "PAT_I_MIXED";
  else if (topStretch) pattern = "PAT_" + SHORT[topStretch];
  else pattern = "PAT_FALLBACK_NO_STRAIN";

  // 10.3 PRACTICE
  const fixed = { PAT_G_STRONG_SUPPORT: "PRACT_G", PAT_A_PRIORITY_CROWDOUT: "PRACT_A", PAT_C_RELATIONSHIPS: "PRACT_C", PAT_B_ENERGY_RESTORE: "PRACT_B", PAT_I_MIXED: "PRACT_I" };
  let practice;
  if (fixed[pattern]) practice = fixed[pattern];
  else if (pattern === "PAT_H_MULTIPLE_STRETCH") practice = "PRACT_" + SHORT[topStretch];
  else if (pattern === "PAT_FALLBACK_NO_STRAIN") practice = /^SUP_Q\d$/.test(support) ? "PRACT_" + support.slice(4) : "PRACT_G";
  else practice = "PRACT_" + pattern.slice(4); // individual stretch PAT_Q#

  return { support, pattern, practice, counts: { stretchCount, supportCount, mixedCount } };
}
/* ENGINE-END */

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const arrow = '<span class="arrow" aria-hidden="true">&rarr;</span>';

function applyBrandColors() {
  const vars = set => Object.entries(set).map(([k, v]) => `--${k}:${v}`).join(";");
  const { light, dark } = CONFIG.brand.colors;
  const style = document.createElement("style");
  style.textContent =
    `:root{${vars(light)}}` +
    `@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${vars(dark)};color-scheme:dark}}` +
    `:root[data-theme="dark"]{${vars(dark)};color-scheme:dark}`;
  document.head.appendChild(style);
}

function drawShore() {
  const wave = (period, amp, base) => {
    let d = `M0 ${base}`;
    for (let x = 0; x <= 2400; x += 20) d += ` L${x} ${(base + Math.sin((x / period) * Math.PI * 2) * amp).toFixed(1)}`;
    return d;
  };
  const layer = (cls, period, amp, base, fill) =>
    `<svg class="${cls}" viewBox="0 0 2400 120" preserveAspectRatio="none"><path d="${wave(period, amp, base)} L2400 120 L0 120 Z" fill="${fill}"/></svg>`;
  document.getElementById("shore").innerHTML =
    layer("w1", 800, 9, 34, "var(--wave-back)") +
    layer("w2", 600, 7, 58, "var(--wave-mid)") +
    `<svg class="w3" viewBox="0 0 2400 120" preserveAspectRatio="none"><path d="${wave(1200, 10, 76)}" fill="none" stroke="var(--gold)" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg>` +
    layer("w3", 1200, 8, 86, "var(--wave-front)");
}

function show(html, focusSelector) {
  stage.innerHTML = html;
  context.hidden = state.screen === "welcome";
  context.textContent = CONFIG.brand.title;
  window.scrollTo(0, 0);
  const target = focusSelector && stage.querySelector(focusSelector);
  if (target) target.focus({ preventScroll: true });
}

  const L = CONFIG.landing;

          </div>

}

function optionHtml(q, label, n, selected) {
  return `<label class="opt">
    <input type="radio" name="answer" id="${q.id}-opt-${n}" value="${esc(label)}"${selected === label ? " checked" : ""}>
    <span class="opt-face"><span class="dot" aria-hidden="true"></span><span>${esc(label)}</span></span>
  </label>`;
}

function renderQuestion() {
  const Q = CONFIG.quiz, total = CONFIG.questions.length, i = state.index, q = CONFIG.questions[i];
  const selected = state.answers[q.id];
  const last = i === total - 1;
  const label = Q.progressLabel.replace("{n}", i + 1).replace("{total}", total);
  const extras = q.extraOptions || [];
  show(`
    <form class="screen" id="q-form" novalidate>
      <div class="progress">
        <p class="eyebrow" id="progress-label">${esc(label)}</p>
        <div class="progress-track" role="progressbar" aria-labelledby="progress-label" aria-valuemin="1" aria-valuemax="${total}" aria-valuenow="${i + 1}">
          ${CONFIG.questions.map((_, n) => `<span class="${n < i ? "done" : n === i ? "now" : ""}"></span>`).join("")}
        </div>
      </div>
      <fieldset>
        <legend tabindex="-1" id="q-legend"><span class="q-prompt">${esc(q.prompt)}</span></legend>
        <div class="scale" style="--cols:${CONFIG.scale.length}">${CONFIG.scale.map((o, n) => optionHtml(q, o, n, selected)).join("")}</div>
        ${extras.length ? `<div class="alt"><span class="small muted">${esc(Q.extraDivider)}</span>${extras.map((o, n) => optionHtml(q, o, CONFIG.scale.length + n, selected)).join("")}</div>` : ""}
      </fieldset>
      <div class="nav">
        <button type="button" class="btn btn-quiet" id="back">${esc(Q.back)}</button>
        <button type="submit" class="btn" id="next" aria-disabled="${selected ? "false" : "true"}">${esc(last ? Q.finish : Q.next)} ${arrow}</button>
        <span class="hint small" id="hint" role="status"></span>
      </div>
    </form>`, "#q-legend");

  const form = document.getElementById("q-form"), next = document.getElementById("next"), hint = document.getElementById("hint");
  form.addEventListener("change", e => {
    if (e.target.name !== "answer") return;
    state.answers[q.id] = e.target.value;
    next.setAttribute("aria-disabled", "false");
    hint.textContent = "";
  });
  form.addEventListener("submit", e => {
    e.preventDefault();
    if (!state.answers[q.id]) { hint.textContent = Q.required; return; }
    if (last) { state.screen = "reflection"; renderReflection(); }
    else { state.index = i + 1; renderQuestion(); }
  });
  document.getElementById("back").addEventListener("click", () => {
    if (i === 0) { state.screen = "welcome"; renderWelcome(true); }
    else { state.index = i - 1; renderQuestion(); }
  });
}

    <article class="screen" aria-labelledby="notice-title">
      <header class="complete">
        <span class="mark"><img src="${document.querySelector('.brand-plate img').src}" alt=""></span>

        <div class="flourish" aria-hidden="true"><span></span></div>
        <p>${esc(R.intro)}</p>
        <div class="sea" aria-hidden="true">${seaHtml()}</div>
      </header>
      <div class="results">
        ${slotHtml("", L.SUPPORT, picked.support)}
        ${slotHtml("", L.PATTERN, picked.pattern)}
        ${slotHtml("practice", L.PRACTICE, picked.practice)}
      </div>
      <section class="recap" aria-labelledby="recap-title">
        <h2 id="recap-title">${esc(R.responsesHeading)}</h2>
        <ol>${CONFIG.questions.map(q => `<li><span class="q">${esc(q.prompt)}</span><span class="a">${esc(state.answers[q.id])}</span></li>`).join("")}</ol>
      </section>
      <section class="notice" aria-labelledby="notice-q-title">
        <h2 id="notice-q-title">${esc(R.noticeHeading)}</h2>
        <ul class="prompts">${R.prompts.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
      </section>
      <aside class="statement"><hr class="rule"><p>${esc(R.statement)}</p></aside>
      ${invite}
      <div><button type="button" class="btn btn-quiet" id="retake">${esc(R.retake)}</button></div>
    </article>`, "#notice-title");

  document.getElementById("retake").addEventListener("click", () => { state = fresh(); renderWelcome(true); });
}

function start(saved) {
  if (saved && saved.v === 3 && saved.screen) state = Object.assign(fresh(), saved);
  if (state.index >= CONFIG.questions.length) state.index = 0;
  document.getElementById("brand-name").textContent = CONFIG.brand.name;
  applyBrandColors();
  drawShore();
  if (state.screen === "question") renderQuestion();
  else if (state.screen === "reflection") renderReflection();
  else renderWelcome(false);
}
window.claude?.hot?.snapshot?.(() => state);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
